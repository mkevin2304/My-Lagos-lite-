<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagos Hustle Lite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    header {
      background: linear-gradient(90deg, #f97316, #ea580c);
      padding: 16px 20px;
      text-align: center;
    }
    header h1 { font-size: 1.4rem; margin-bottom: 4px; }
    header p { font-size: 0.85rem; opacity: 0.9; }

    #signup-screen, #game-screen { padding: 20px; }
    .hidden { display: none !important; }

    label { display: block; margin-bottom: 6px; font-size: 0.9rem; }
    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #334155;
      color: white;
      margin-bottom: 16px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #f97316;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover { background: #ea580c; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #64748b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat .label { font-size: 0.75rem; opacity: 0.7; }
    .stat .value { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }

    .location {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      min-height: 80px;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .actions button { margin-bottom: 0; }

    #chat-log {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      height: 180px;
      overflow-y: auto;
      margin-bottom: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .msg { margin-bottom: 8px; }
    .msg.system { color: #94a3b8; font-style: italic; }
    .msg.npc { color: #38bdf8; }
    .msg.player { color: #4ade80; }

    .chat-input {
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      margin-bottom: 0;
    }
    .chat-input button {
      width: auto;
      padding: 0 16px;
      margin-bottom: 0;
    }

    .day-info {
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Lagos Hustle Lite</h1>
      <p>Simple life in the city</p>
    </header>

    <!-- SIGN UP SCREEN -->
    <div id="signup-screen">
      <label>Your Name</label>
      <input type="text" id="player-name" placeholder="e.g. Tunde, Amaka..." maxlength="20">

      <label>Email (just for show)</label>
      <input type="email" id="player-email" placeholder="you@example.com">

      <button onclick="startGame()">Start Hustling</button>
      <p style="font-size:0.8rem; opacity:0.6; text-align:center; margin-top:12px;">
        Progress is saved automatically in your browser.
      </p>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
      <div class="day-info" id="day-info">Day 1 • Morning</div>

      <div class="stats">
        <div class="stat">
          <div class="label">Cash</div>
          <div class="value" id="cash">₦50,000</div>
        </div>
        <div class="stat">
          <div class="label">Energy</div>
          <div class="value" id="energy">80</div>
        </div>
        <div class="stat">
          <div class="label">Happiness</div>
          <div class="value" id="happiness">50</div>
        </div>
      </div>

      <div class="location" id="location-text">
        You are in your small room in Yaba...
      </div>

      <div class="actions" id="action-buttons">
        <!-- Buttons will be generated by JS -->
      </div>

      <div id="chat-log"></div>

      <div class="chat-input">
        <input type="text" id="chat-input" placeholder="Type to chat or give a command..." maxlength="120">
        <button onclick="handleChat()">Send</button>
      </div>

      <button class="secondary" onclick="resetGame()" style="margin-top:12px;">New Game</button>
    </div>
  </div>

<script>
  // ========== GAME STATE ==========
  let state = {
    name: "",
    email: "",
    cash: 50000,
    energy: 80,
    happiness: 50,
    day: 1,
    time: "Morning", // Morning, Afternoon, Evening, Night
    location: "home",
    inventory: []
  };

  const locations = {
    home: {
      name: "Your Room (Yaba)",
      desc: "A small room with a fan that sometimes works. Your mattress is on the floor. The generator downstairs is humming."
    },
    market: {
      name: "Balogun Market Area",
      desc: "Crowded, loud, and full of opportunity (and hustlers). You can buy food or clothes here."
    },
    job: {
      name: "Job Center / Cyber Café",
      desc: "People looking for work or printing CVs. You can try to find a small hustle."
    },
    street: {
      name: "Yaba Road",
      desc: "Busy street with danfos, street sellers, and people going about their day."
    },
    club: {
      name: "Small Bar / Spot",
      desc: "Loud music, cold drinks, and people trying to forget the stress of Lagos for a few hours."
    }
  };

  // ========== INIT ==========
  window.onload = () => {
    const saved = localStorage.getItem("lagosHustleLite");
    if (saved) {
      state = JSON.parse(saved);
      showGame();
      updateUI();
      addLog("system", "Welcome back, " + state.name + "!");
    }
  };

  function startGame() {
    const name = document.getElementById("player-name").value.trim() || "Player";
    const email = document.getElementById("player-email").value.trim() || "no-email@example.com";
    state.name = name;
    state.email = email;
    state.cash = 50000;
    state.energy = 80;
    state.happiness = 50;
    state.day = 1;
    state.time = "Morning";
    state.location = "home";
    state.inventory = [];
    save();
    showGame();
    updateUI();
    addLog("system", `Welcome to Lagos, ${state.name}! You have ₦50,000 to start your hustle.`);
  }

  function showGame() {
    document.getElementById("signup-screen").classList.add("hidden");
    document.getElementById("game-screen").classList.remove("hidden");
  }

  function save() {
    localStorage.setItem("lagosHustleLite", JSON.stringify(state));
  }

  function resetGame() {
    if (confirm("Start a completely new game? This will erase your current progress.")) {
      localStorage.removeItem("lagosHustleLite");
      location.reload();
    }
  }

  // ========== UI UPDATE ==========
  function updateUI() {
    document.getElementById("cash").textContent = "₦" + state.cash.toLocaleString();
    document.getElementById("energy").textContent = state.energy;
    document.getElementById("happiness").textContent = state.happiness;
    document.getElementById("day-info").textContent = `Day ${state.day} • ${state.time}`;

    const loc = locations[state.location];
    document.getElementById("location-text").innerHTML = `<strong>${loc.name}</strong><br>${loc.desc}`;

    renderActions();
    save();
  }

  function renderActions() {
    const container = document.getElementById("action-buttons");
    container.innerHTML = "";

    const actions = getAvailableActions();
    actions.forEach(a => {
      const btn = document.createElement("button");
      btn.textContent = a.label;
      btn.onclick = a.fn;
      if (a.disabled) btn.disabled = true;
      container.appendChild(btn);
    });
  }

  function getAvailableActions() {
    const acts = [];

    if (state.location !== "home") {
      acts.push({ label: "Go Home", fn: () => changeLocation("home") });
    }
    if (state.location !== "market") {
      acts.push({ label: "Go to Market", fn: () => changeLocation("market") });
    }
    if (state.location !== "job") {
      acts.push({ label: "Look for Work", fn: () => changeLocation("job") });
    }
    if (state.location !== "street") {
      acts.push({ label: "Go to Street", fn: () => changeLocation("street") });
    }
    if (state.location !== "club" && state.time !== "Morning") {
      acts.push({ label: "Go to Bar", fn: () => changeLocation("club") });
    }

    // Location-specific
    if (state.location === "home") {
      acts.push({ label: "Rest (+Energy)", fn: rest });
      acts.push({ label: "Sleep (Next Day)", fn: sleep });
    }
    if (state.location === "market") {
      acts.push({ label: "Buy Food (₦2,500)", fn: () => buy("food") });
      acts.push({ label: "Buy Clothes (₦8,000)", fn: () => buy("clothes") });
    }
    if (state.location === "job") {
      acts.push({ label: "Try for Work", fn: tryWork });
    }
    if (state.location === "club") {
      acts.push({ label: "Buy Drink (₦3,000)", fn: () => buy("drink") });
    }

    return acts;
  }

  // ========== ACTIONS ==========
  function changeLocation(loc) {
    if (state.energy < 10) {
      addLog("system", "You're too tired to move around. Rest first.");
      return;
    }
    state.energy -= 8;
    state.location = loc;
    advanceTime();
    addLog("system", `You went to ${locations[loc].name}.`);
    updateUI();
  }

  function rest() {
    state.energy = Math.min(100, state.energy + 25);
    state.happiness = Math.min(100, state.happiness + 5);
    addLog("system", "You rested for a while. Feeling better.");
    advanceTime();
    updateUI();
  }

  function sleep() {
    state.energy = 90;
    state.day += 1;
    state.time = "Morning";
    state.location = "home";
    addLog("system", `You slept. Good morning! It's Day ${state.day}.`);
    // Small daily cost of living
    state.cash -= 1500;
    if (state.cash < 0) state.cash = 0;
    updateUI();
  }

  function buy(item) {
    const prices = { food: 2500, clothes: 8000, drink: 3000 };
    const price = prices[item];
    if (state.cash < price) {
      addLog("system", "You don't have enough money.");
      return;
    }
    state.cash -= price;

    if (item === "food") {
      state.energy = Math.min(100, state.energy + 20);
      state.happiness = Math.min(100, state.happiness + 8);
      addLog("system", "You bought and ate some food. Tasty!");
    } else if (item === "clothes") {
      state.happiness = Math.min(100, state.happiness + 15);
      addLog("system", "New clothes! You look fresh.");
    } else if (item === "drink") {
      state.happiness = Math.min(100, state.happiness + 12);
      state.energy = Math.max(0, state.energy - 5);
      addLog("system", "You bought a cold drink and relaxed a bit.");
    }
    advanceTime();
    updateUI();
  }

  function tryWork() {
    if (state.energy < 20) {
      addLog("system", "You're too tired to work properly.");
      return;
    }
    state.energy -= 20;
    const roll = Math.random();
    if (roll > 0.45) {
      const pay = 4000 + Math.floor(Math.random() * 6000);
      state.cash += pay;
      state.happiness = Math.min(100, state.happiness + 5);
      addLog("system", `You found a small hustle and earned ₦${pay.toLocaleString()}!`);
    } else {
      addLog("system", "No luck today. Nobody needed help.");
      state.happiness = Math.max(0, state.happiness - 5);
    }
    advanceTime();
    updateUI();
  }

  function advanceTime() {
    const times = ["Morning", "Afternoon", "Evening", "Night"];
    let idx = times.indexOf(state.time);
    idx++;
    if (idx >= times.length) {
      idx = 0;
      state.day++;
      // daily living cost
      state.cash = Math.max(0, state.cash - 1500);
    }
    state.time = times[idx];

    // Soft caps
    if (state.energy <= 0) {
      state.energy = 0;
      addLog("system", "You're completely exhausted...");
    }
    if (state.happiness <= 0) {
      state.happiness = 0;
      addLog("system", "You're feeling really down.");
    }
  }

  // ========== CHAT SYSTEM ==========
  function addLog(type, text) {
    const log = document.getElementById("chat-log");
    const div = document.createElement("div");
    div.className = `msg ${type}`;
    div.textContent = (type === "player" ? "You: " : type === "npc" ? "NPC: " : "") + text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function handleChat() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    addLog("player", text);
    input.value = "";

    // Simple keyword responses
    const lower = text.toLowerCase();
    let reply = "";

    if (lower.includes("hello") || lower.includes("hi") || lower.includes("how far")) {
      reply = "How far now? Wetin you dey find for this side?";
    } else if (lower.includes("money") || lower.includes("cash") || lower.includes("broke")) {
      reply = "Everybody dey look money for Lagos. Just keep hustling.";
    } else if (lower.includes("job") || lower.includes("work")) {
      reply = "Try the job center or just ask people on the street. Something go show.";
    } else if (lower.includes("food") || lower.includes("hungry")) {
      reply = "Market no far. You fit buy something sharp sharp.";
    } else if (lower.includes("help")) {
      reply = "I no be your oga, but try rest when you tired and no blow all your money for club.";
    } else if (state.location === "club") {
      reply = "This place sweet! You go buy drink or you just come look people?";
    } else if (state.location === "market") {
      reply = "Customer! Wetin you want buy today?";
    } else {
      const generic = [
        "E be like say you dey think deep.",
        "Lagos no easy, but we go manage.",
        "Alright na, take it easy.",
        "I hear you. Just dey your lane.",
        "Hmm, make we see how e go be."
      ];
      reply = generic[Math.floor(Math.random() * generic.length)];
    }

    setTimeout(() => {
      addLog("npc", reply);
    }, 400 + Math.random() * 600);
  }

  // Allow Enter key
  document.getElementById("chat-input")?.addEventListener("keypress", function(e) {
    if (e.key === "Enter") handleChat();
  });
</script>
</body>
</html>
